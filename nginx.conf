server {
    listen 80;
    server_name localhost taller.sh www.taller.sh;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Serve open blueprints directory cleanly for free download
    location ^~ /blueprints/ {
        default_type text/plain;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SEO & AI Crawlers (GEO)
    location = /robots.txt {
        default_type text/plain;
        log_not_found off;
        access_log off;
    }

    location = /llms.txt {
        default_type text/plain;
        add_header Access-Control-Allow-Origin "*";
    }

    location = /sitemap.xml {
        default_type application/xml;
    }

    # Never serve dotfiles or internal repository docs/scripts/configs publicly
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(md|sh|yml|yaml|toml|conf)$ {
        return 404;
    }

    location = /manifesto {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /manifesto.html =404;
    }

    location = /manifesto/ {
        return 301 /manifesto;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Revalidate CSS/JS via ETag so updates appear immediately
    location ~* \.(css|js|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache binary images
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Error handling
    error_page 404 /index.html;
}
