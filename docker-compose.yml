services:
  web:
    image: nginx:alpine
    container_name: taller-sh-web
    restart: unless-stopped
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - open-notebook_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=open-notebook_default"
      # Service definition
      - "traefik.http.services.tallersh.loadbalancer.server.port=80"
      
      # Real domain with Let's Encrypt
      - "traefik.http.routers.tallersh.rule=Host(`taller.sh`) || Host(`www.taller.sh`)"
      - "traefik.http.routers.tallersh.entrypoints=websecure"
      - "traefik.http.routers.tallersh.tls=true"
      - "traefik.http.routers.tallersh.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.tallersh.service=tallersh"

      # Direct IP router (for accessing https://46.224.163.251 directly)
      - "traefik.http.routers.tallersh-ip.rule=Host(`46.224.163.251`)"
      - "traefik.http.routers.tallersh-ip.entrypoints=websecure"
      - "traefik.http.routers.tallersh-ip.tls=true"
      - "traefik.http.routers.tallersh-ip.service=tallersh"

networks:
  open-notebook_default:
    external: true
